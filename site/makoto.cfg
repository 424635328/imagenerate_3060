# makoto.cfg — 站点图标 / 动效配置（结城理 风格化演绎）
#
# 风格化同人致敬：原作《Persona 3 Reload》及角色「结城理 / Makoto Yuki」版权归 ATLUS / SEGA 所有。
# 本目录下的图形均为本项目原创绘制的风格化演绎，非官方素材，请勿作商业使用。
#
# 重新生成： python make_makoto_icons.py        （静态 PNG 多尺寸）
#            python make_makoto_preview.py      （动效分帧预览图）

[icon]
name        = Makoto（雷霆·召唤）
style       = 徽章（圆角方底 + 深蓝发角色 + 举召唤器抵额）
viewbox     = 0 0 64 64
badge_rx    = 14

[colors]
accent_a    = #6ea8ff      # 渐变起点
accent_b    = #5a46be      # 渐变终点
hair        = #1b2244 / #26305c
skin        = #efd0b0
blazer      = #222a4c / #2e3860
shirt       = #f1f5fc
tie         = #9c3b47
headphones  = #2b3243 / #828ea4
evoker      = #3c4460 / #7886a6

[assets]
svg_static  = /makoto.svg
svg_anim    = /makoto-thunder.svg     # 动画版（页头 logo）
png_512     = /makoto-512.png
png_180     = /makoto-180.png         # apple-touch-icon
png_32      = /makoto-32.png          # favicon 回退
png_16      = /makoto-16.png
demo        = /makoto.html            # 大图动效演示页

[animation]
loop        = 7s
0.0-0.7s    = 雷霆开场：雷暴压暗 + 闪电闪光 + 云层
0.7-1.0s    = 登场：从高空放大砸地 + 高速线
1.0-1.6s    = 冲击波：冲击环扩散 + 震屏抖动
1.6-3.8s    = 待机：呼吸浮动（3s）+ 发梢轻摆（3.4s）+ 眨眼（3.6s）
3.8-4.9s    = 召唤：抬臂（rotate -26deg）· 召唤器抵住太阳穴 · 电弧炸开 + 蓝焰光晕
4.9-5.8s    = 出场：光晕爆发 → 冲天缩放消散 + 冲击环
5.8-6.4s    = 转场：斜向光带扫过 + 全屏闪白
6.4-7.0s    = 黑场：虹膜收束 → 循环
reduced_motion = 支持（prefers-reduced-motion 时关闭全部动画）
note        = 浏览器 favicon 不支持动画，故 favicon 用静态 makoto.svg，页头 logo 用 makoto-thunder.svg
