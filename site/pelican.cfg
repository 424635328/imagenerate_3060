# pelican.cfg — 站点图标（web icon）配置
# 矢量源：site/pelican.svg      位图：由 make_pelican_icons.py 生成（PIL，无需额外依赖）
# 重新生成： python make_pelican_icons.py

[icon]
name        = Pelican
style       = badge（圆角方形底 + 白色鹈鹕剪影 + 橙色喙/喉囊）
viewbox     = 0 0 64 64
badge_rx    = 14

[colors]
accent_a    = #6ea8ff      # 渐变起点（与站点 --accent 一致）
accent_b    = #c084fc      # 渐变终点（与站点 --accent2 一致）
body        = #ffffff
body_shade  = #cedef3
wing        = #baccea
beak        = #fbbf24
pouch_line  = #f59e0b
eye         = #0b0e14

[assets]
svg         = /pelican.svg
svg_anim    = /pelican-anim.svg     # 动态版（CSS 动画，用于页头 logo）
png_512     = /pelican-512.png
png_180     = /pelican-180.png      # apple-touch-icon
png_32      = /pelican-32.png       # favicon 回退
png_16      = /pelican-16.png

[animation]
loop_motion = 3s     # 呼吸浮动 translateY 0→-1.5px + 颈头摆动 rotate ±1.8deg + 喉囊 scale 1→1.05
loop_blink  = 3.6s   # 眨眼 scaleY 1→0.08（90%~96% 处）
loop_sheen  = 6s     # 徽章高光 translateX -60→120（56%~86%）
reduced_motion = 支持（prefers-reduced-motion 时关闭全部动画）
note        = 浏览器 favicon 不支持动画，故 favicon 用静态 pelican.svg，页头 logo 用 pelican-anim.svg
preview     = python make_pelican_anim_preview.py  ->  outputs/pelican_anim_frames.png

[html]
favicon_svg   = <link rel="icon" href="/pelican.svg" type="image/svg+xml">
favicon_png32 = <link rel="icon" href="/pelican-32.png" sizes="32x32" type="image/png">
apple_touch   = <link rel="apple-touch-icon" href="/pelican-180.png">
theme_color   = <meta name="theme-color" content="#6ea8ff">
header_logo   = <img src="/pelican.svg" alt="Pelican" width="36" height="36">
