# V6q 配方：**唯一变量是 caption**（Qwen2-VL-2B 结构化重写），其余与 V5 逐项相同。
#
# 命名说明：本配置是**训练实验** V6q（caption 对照），与 README 第 17 节的"产品阶段 V6"
# （上传安全 / 任务取消 / 工程门禁）无关。
#
# 为什么要做这个对照：V5/V5b/融合在固定协议 val 上都只比 V4 好 0.3%，而出图指标（锐度/CLIP）
# 完全区分不开。检查数据后发现 1664 条 caption **全部带同一模板尾巴**
# （`..., professional landscape photography, <地点>`，中位数仅 14 词）——模型学到的是模板，
# 不是"控制"。因此本轮把数据标注换成结构化描述（主体/地貌/天气光线/时间季节/色调氛围/摄影风格），
# 训练配方一字不改，用**留出 prompt 的 CLIP 一致性 + KID** 判断是否真的更好。
#
# 结果（2026-09-14）：caption 信息量从 6 个实词提到 9 个具体短语（1649/1664 张），
# **画质依然没有变好** —— KID 与盲测裁判均与 V4 无法区分；详见 docs/TRAINING.md §11.1 与
# docs/FINAL_VERDICT.md。本配置保留作为可复现的对照实验。
#
# 步骤:
#   1) python tools/recaption_driver.py --manifest dataset1024/manifest.json \
#          --out dataset1024/captions_qwen.json --checkpoint-every 25 --max-edge 512
#   2) python precompute_v5.py --base SG161222/Realistic_Vision_V6.0_B1_noVAE --arch sd15 \
#          --res 640 --crops 3 --out dataset1024/cache_v6_qwen640.pt
#   3) python tools/train_driver.py --script train_v5.py --config config_v6q.cfg \
#          --save_every 500 --min-free 1.8 --stall-seconds 300
#   4) python tools/eval_fid.py --adapters "V4:..." "V5:..." "V6q:models/v6_qwen/adapter_best" ...
pretrained_model_name_or_path=SG161222/Realistic_Vision_V6.0_B1_noVAE
arch=sd15
cache=dataset1024/cache_v6_qwen640.pt
out_dir=models/v6_qwen

resolution=640
train_batch_size=1
gradient_accumulation_steps=2

# 与 config_v5.cfg 逐项一致（唯一变量是 caption）
lora_rank=64
lora_alpha=64
lora_dropout=0.08
use_dora=false

optimizer=prodigy
learning_rate=1.0
weight_decay=0.01
lr_scheduler=constant
lr_warmup_steps=0

min_snr_gamma=5.0

caption_dropout=0.05
ema_decay=0.9995
finetune_text=false

gradient_checkpointing=true
mixed_precision=fp16
max_train_steps=4000
save_every=500
eval_every=250
eval_subset=48
keep_checkpoints=3
seed=42
cache_dir=models/hf_cache
