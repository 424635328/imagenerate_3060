# V5b 配方：在 V5 的 UNet 适配器基础上**补训 CLIP 文本编码器**
#
# 为什么需要：线上 V4 的部署形态是「UNet LoRA **+ 微调过的 CLIP**」
# （app.py 会额外加载 <adapter>_text_encoder.pt，240 MB）。V5 目前只训了 UNet、
# 文本编码器冻结 —— 这是 val 差距的一部分来源。本阶段用约 1/3 的算力补齐这一项，
# 让 V5 以**同等形态**与 V4 对比。
#
# 训练: python train_v5.py --config config_v5b.cfg
# 产出: models/v5b_lora/adapter_best/ + models/v5b_lora/adapter_best_text_encoder.pt
#       （后者正是 app.py 期望的文件名，可直接把 LORA_ADAPTER 指过去部署）
pretrained_model_name_or_path=SG161222/Realistic_Vision_V6.0_B1_noVAE
arch=sd15
# 512 缓存：V5b 额外把 CLIP 文本编码器以 fp32 载入并训练（+梯度+优化器状态）。
# 2026-09-13 实测：用 640 缓存时稳定占用 5.0GB，在 6GB 卡上触发 WDDM 抖动并**完全卡死**
# （180 秒 0 步推进、GPU 100%、CPU 空转、cudaMalloc 无法满足）。降到 512 使激活内存减少 36%。
cache=dataset1024/cache_v4.pt
out_dir=models/v5b_lora

# 从 V5 最优 UNet 适配器出发，避免重训 UNet
init_lora=models/v5_lora/adapter_best

resolution=512
train_batch_size=1
gradient_accumulation_steps=2
lora_rank=64
lora_alpha=64
lora_dropout=0.08
use_dora=false

# 关键：解冻文本编码器（trainer 会自动改为在线编码 caption，缓存文本被旁路；
# 且可训练权重会以 fp32 主权重加载 —— GradScaler 不接受 fp16 梯度）
finetune_text=true
text_lr=0.000005

# 优化器必须是 adamw/adamw8bit：Prodigy 只支持单一全局学习率，无法给 UNet 与 TE
# 设不同步长（底层直接报错）。低步长微调场景下 AdamW 也正是 V4 原本的设计。
# 用 8bit 变体：fp32 TE 的参数+梯度+AdamW 双状态要 ~2GB，实测峰值会顶到 4.7GB
# 导致 6GB 卡 WDDM 抖动（步进从 1.7s 掉到 30s）。
optimizer=adamw8bit
learning_rate=0.00001      # UNet LoRA：小幅微调
lr_scheduler=cosine
lr_warmup_steps=100
weight_decay=0.01
# int8 基座再省 ~1.2GB（QLoRA 式：量化基座冻结，只训 fp16 LoRA 与 fp32 TE）
base_8bit=true

min_snr_gamma=5.0
caption_dropout=0.05
ema_decay=0.9995

gradient_checkpointing=true
mixed_precision=fp16
max_train_steps=1200
save_every=200
eval_every=200
# 验证子集从 48 降到 8：验证会额外申请一批激活，在只剩 1GB 余量时正是压垮显存的最后一根稻草
eval_subset=8
keep_checkpoints=3
seed=42
cache_dir=models/hf_cache
