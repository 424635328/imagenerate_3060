# V5-SDXL 配方：RealVisXL V5.0 + 8-bit 量化基座（QLoRA 式）LoRA 训练
# 6GB 显存的关键：fp16 SDXL UNet 单权重 4.9GB 放不下 → int8 基座约 2.5GB，
# LoRA 适配器仍以 fp16 训练；文本嵌入全部预计算，双文本编码器不进显存。
#
# 数据: python precompute_v5.py --base SG161222/RealVisXL_V5.0 --arch sdxl --res 1024 \
#           --out dataset1024/cache_v5_sdxl1024.pt
# 训练: python train_v5.py --config config_v5_sdxl.cfg
pretrained_model_name_or_path=SG161222/RealVisXL_V5.0
arch=sdxl
cache=dataset1024/cache_v5_sdxl1024.pt
out_dir=models/v5_sdxl

resolution=1024
train_batch_size=1
gradient_accumulation_steps=4

lora_rank=32
lora_alpha=32
lora_dropout=0.05
use_dora=false

# QLoRA：int8 基座 + fp16 适配器；Prodigy 自适应 LR
base_8bit=true
optimizer=prodigy
learning_rate=1.0
weight_decay=0.01
lr_scheduler=constant
lr_warmup_steps=0

min_snr_gamma=5.0
caption_dropout=0.05
ema_decay=0.9995
finetune_text=false

gradient_checkpointing=true
mixed_precision=fp16
max_train_steps=2500
save_every=500
eval_every=250
eval_subset=24
keep_checkpoints=2
seed=42
cache_dir=models/hf_cache
