# 训练配置（k=v，可被命令行参数覆盖）。用法: python train_text_to_image.py --config config.cfg
# 3060 6GB 实测：512 / batch4 / rank16 / 梯度检查点 / fp16 → 峰值约 3.3GB，单步约 1.12s
pretrained_model_name_or_path=stable-diffusion-v1-5/stable-diffusion-v1-5
data_dir=dataset
out_dir=models/lora
resolution=512
train_batch_size=4
gradient_accumulation_steps=1
lora_rank=16
lora_alpha=16
learning_rate=0.0001
lr_warmup_steps=300
max_train_steps=3000
num_train_epochs=8
gradient_checkpointing=true
mixed_precision=fp16
seed=42
save_every=250
eval_every=100
keep_checkpoints=3
cache_dir=models/hf_cache
