# V3 训练配置：逐批增强 + 在线 VAE 编码（可长训/抗过拟合）+ 验证选优
pretrained_model_name_or_path=SG161222/Realistic_Vision_V6.0_B1_noVAE
data_dir=dataset
out_dir=models/v3_lora
resolution=512
train_batch_size=4
gradient_accumulation_steps=1
lora_rank=32
lora_alpha=32
lora_dropout=0.05
learning_rate=0.0001
lr_warmup_steps=2000
max_train_steps=30000
num_train_epochs=60
gradient_checkpointing=true
mixed_precision=fp16
aug=true
seed=42
save_every=500
eval_every=200
eval_subset=64
keep_checkpoints=4
cache_dir=models/hf_cache
