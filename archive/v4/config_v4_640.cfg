# V4-640 高清微调：从 V4 最优权重 init，640 分辨率低 LR 短训（脚本: train_v4.py）
# 先跑预计算(640 多随机裁剪): python precompute_v4.py --res 640 --out dataset1024/cache_v4_640.pt
pretrained_model_name_or_path=SG161222/Realistic_Vision_V6.0_B1_noVAE
data_dir=dataset1024
cache=dataset1024/cache_v4_640.pt
out_dir=models/v4_640
resolution=640
train_batch_size=1
gradient_accumulation_steps=2
lora_rank=64
lora_alpha=64
lora_dropout=0.1
learning_rate=0.00003
text_lr=0.000005
weight_decay=0.01
caption_dropout=0.05
finetune_text=true
ema_decay=0.9995
lr_warmup_steps=50
max_train_steps=800
gradient_checkpointing=true
mixed_precision=fp16
seed=42
save_every=200
eval_every=100
eval_subset=48
keep_checkpoints=3
cache_dir=models/hf_cache
