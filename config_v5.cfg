# V5 生产配方：现代方法在 640 latent 缓存上从基座重训（脚本: train_v5.py）
# 数据: python precompute_v5.py --base SG161222/Realistic_Vision_V6.0_B1_noVAE --res 640 --out dataset1024/cache_v5_640.pt
# 对照基线: V4-640 在 cache_v4_640 测试集上 best val = 0.1262（协议一致，可直接比）
pretrained_model_name_or_path=SG161222/Realistic_Vision_V6.0_B1_noVAE
arch=sd15
cache=dataset1024/cache_v4_640.pt
out_dir=models/v5_lora

resolution=640
train_batch_size=1
gradient_accumulation_steps=2

# 容量：DoRA 若无法被 diffusers 加载则退回纯 LoRA（use_dora=false）
lora_rank=64
lora_alpha=64
lora_dropout=0.08
use_dora=false

# 优化器：Prodigy（arXiv:2306.06101）自适应，无需手调 LR；constant + 自热身
optimizer=prodigy
learning_rate=1.0
weight_decay=0.01
lr_scheduler=constant
lr_warmup_steps=0

# 损失：min-SNR-γ 加权（arXiv:2303.09556）
min_snr_gamma=5.0

caption_dropout=0.05
ema_decay=0.9995
finetune_text=false

gradient_checkpointing=true
mixed_precision=fp16
max_train_steps=4000
save_every=1000
eval_every=250
eval_subset=48
keep_checkpoints=3
seed=42
cache_dir=models/hf_cache
